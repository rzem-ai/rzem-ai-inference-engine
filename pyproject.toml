[project]
name = "rzem-ai-inference-engine"
version = "0.1.0"
description = "Text-to-image inference engine with job queue and VRAM management"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "diffusers>=0.32",
    "transformers>=4.40",
    "accelerate",
    "safetensors",
    "huggingface-hub",
    "pydantic>=2.0",
    "Pillow",
    "click",
    "einops",
    "sentencepiece",
    "protobuf",
    "loguru",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart",
    "zeroconf>=0.131",
]

[project.scripts]
rzem-ai-inference-engine = "rzem_ai_inference_engine.cli:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rzem_ai_inference_engine"]
